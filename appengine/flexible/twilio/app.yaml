runtime: php
env: flex

runtime_config:
  document_root: .
  operating_system: ubuntu22
  runtime_version: 8.3

# [START gae_flex_twilio_env]
env_variables:
    TWILIO_ACCOUNT_SID: your-account-sid
    TWILIO_AUTH_TOKEN: your-auth-token
    TWILIO_FROM_NUMBER: your-twilio-number
# [END gae_flex_twilio_env]
