# Format: //devtools/kokoro/config/proto/build.proto

# Configure the docker image for kokoro-trampoline.
env_vars: {
    key: "TRAMPOLINE_IMAGE"
    value: "gcr.io/cloud-devrel-kokoro-resources/php83"
}

# Temporarily disable deployment tests until sample configs are upgraded off EOL PHP < 8.2 (CVE-2026-109618 / CVE-2026-109619).
env_vars: {
    key: "RUN_DEPLOYMENT_TESTS"
    value: "false"
}

# Only run deployment tests for Cloud Functions
env_vars: {
    key: "TEST_DIRECTORIES"
    value: "functions"
}
